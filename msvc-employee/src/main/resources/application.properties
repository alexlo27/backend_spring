spring.application.name=msvc-employee
server.port=8081
#spring.config.import=optional:application-local.properties
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

spring.jpa.hibernate.ddl-auto=update

# Flyway
#spring.flyway.enabled=true
#spring.flyway.locations=classpath:db/migration
#spring.flyway.baseline-on-migrate=true

#spring.jpa.properties.hibernate.format_sql=true
#logging.level.org.hibernate.SQL=DEBUG
#logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE


#CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Spring Modulith - Configuration
spring.modulith.default-module-type=application
spring.modulith.detect-contained-dependencies=false

# Document generation
spring.modulith.document-api=true

# Module dependencies
# catalog -> shared (base dependencies)
# employee -> catalog, shared, employment (via EmploymentQueryService interface), schedule (via ScheduleQueryService interface)
# employment -> employee, organization, catalog, shared
# organization -> shared
# schedule -> shared

# Approval
app.approval.max-levels=2
